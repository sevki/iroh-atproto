[package]
name = "iroh-atproto"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Resolve iroh nodes via AT Protocol DID documents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sevki/iroh-atproto"
keywords = ["iroh", "atproto", "bluesky", "resolver", "p2p"]

[dependencies]
# Iroh P2P connectivity
iroh = "0.97.0"
# AT Protocol identity and DID document resolution
atrium-api = { version = "0.25.7", default-features = false }
atrium-identity = "0.1.8"
atrium-common = "0.1.3"
atrium-xrpc = "0.12.4"
# DNS resolution for AT Protocol handles
hickory-resolver = "0.25.1"
# HTTP client for AT Protocol services (PLC directory, well-known endpoints)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async runtime
n0-error = "0.1"
n0-future = "0.3"
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
