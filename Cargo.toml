[package]
name = "iroh-atproto"
version = "0.1.0"
edition = "2021"
description = "Iroh resolver library for AT Protocol records using atrium"
license = "MIT"

[dependencies]
atrium-api = "0.25.7"
atrium-xrpc = "0.12.4"
atrium-xrpc-client = "0.5.15"
iroh = { version = "0.97.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
n0-future = "0.3.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
